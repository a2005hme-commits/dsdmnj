<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>حلا ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700;900&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>

<body>

<audio id="music" loop>
<source src="music.mp3" type="audio/mpeg">
</audio>


<div class="background"></div>


<!-- شاشة البداية -->

<section class="hero">

<div class="stars"></div>

<h1 class="name">
حلا ❤️
</h1>

<p class="subtitle">
أنتِ أجمل صدفة وأجمل قصة في حياتي
</p>


<button class="btn" onclick="openLove()">
ابدئي المفاجأة ❤️
</button>


</section>



<!-- الرسالة -->

<section id="love" class="section">

<div class="glass">

<h2 class="title">
رسالة إلى حلا 💌
</h2>


<p id="typing" class="message"></p>


</div>

</section>



<!-- العداد -->

<section class="section">

<h2 class="title">
منذ بداية قصتنا ❤️
</h2>


<div class="counter">


<div class="box">
<h2 id="days">0</h2>
<p>يوم</p>
</div>


<div class="box">
<h2 id="hours">0</h2>
<p>ساعة</p>
</div>


<div class="box">
<h2 id="minutes">0</h2>
<p>دقيقة</p>
</div>


<div class="box">
<h2 id="seconds">0</h2>
<p>ثانية</p>
</div>


</div>

</section>




<!-- الصور -->

<section class="section">

<h2 class="title">
ذكريات حلا 📸
</h2>


<div class="gallery">


<div class="photo">
<img src="photo1.jpg">
</div>


<div class="photo">
<img src="photo2.jpg">
</div>


<div class="photo">
<img src="photo3.jpg">
</div>


</div>


</section>





<!-- المفاجأة -->


<section class="section">

<div class="glass surprise">


<h2>
حلا ❤️
</h2>


<p>
هناك شخص واحد يجعل أيامي أجمل...
وهو أنتِ ❤️
</p>


<button class="btn" onclick="showLove()">
اضغطي هنا 🎁
</button>


<h1 id="secret"></h1>


</div>


</section>





<footer>

إلى حلا ❤️

<br>

أحبك اليوم وغداً وكل يوم قادم.

</footer>




<script src="script.js"></script>


</body>

</html>
